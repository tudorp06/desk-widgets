name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Build the app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (includes the hidden-character check)
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v7
        with:
          name: DeskWidgets
          path: bin/DeskWidgets.exe

  worker:
    name: Test the upload Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Needs nothing installed: the tests drive the Worker against a pretend GitHub.
      - run: node --test
        working-directory: worker
