name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Build the app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (includes the hidden-character check)
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v7
        with:
          name: DeskWidgets
          path: bin/DeskWidgets.exe
