name: Website

# Publishes docs/ to GitHub Pages, with the gallery built into it first: every widget in widgets/
# gets its page, preview and source under docs/w/, listed in docs/w/gallery.json
# (tools/build-widget-pages.mjs).
#
# Why a workflow instead of "deploy from the main branch": docs/w is generated from widgets/ and
# is not committed, so the published copy has to be built. A widget is live a few minutes after
# its pull request is merged.
#
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", "widgets/**", "tools/build-widget-pages.mjs", "tools/widget-rules.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The whole history: a widget's date in the gallery is the commit that last changed it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the gallery
        run: node tools/build-widget-pages.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - uses: actions/deploy-pages@v5
        id: deploy
