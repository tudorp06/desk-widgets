<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget · Desk Widgets</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="modulepreload" href="assets/site.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="assets/data.js">
</head>
<body>
  <main class="content section" id="page"></main>

  <script type="module">
    import { nav, el, artFrom, getButton, categoryName, isValidId, notice, formatDate, visibleSource, avatar, REPO_URL } from "./assets/site.js";
    import { getWidget, getProfile, getPreviews, getSource } from "./assets/data.js";

    nav(null);
    const page = document.getElementById("page");
    const id = new URLSearchParams(location.search).get("id");

    async function load() {
      if (!isValidId(id)) { page.replaceChildren(notice("This link doesn't point to a widget.", true)); return; }
      try {
        const w = await getWidget(id);
        if (!w) { page.replaceChildren(notice("This widget isn't available.", true)); return; }
        const [source, author, previews] = await Promise.all([getSource(w), getProfile(w.author), getPreviews([w])]);
        show(w, source, author || { username: w.author, bio: "" }, previews.get(id) || null);
      } catch (e) {
        page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true));
      }
    }

    function show(w, source, author, preview) {
      document.title = w.name + " · Desk Widgets";
      const kb = Math.max(1, Math.round(new TextEncoder().encode(source).length / 1024));
      const fact = (label, value, unit) => el("div", {}, el("div", { class: "label" }, label), el("div", { class: "value" }, value), el("div", { class: "unit" }, unit));
      // The widget's folder in the repository: where every change to it was reviewed.
      const [, folder, slug] = id.split(".");
      const history = REPO_URL + "/commits/main/widgets/" + encodeURIComponent(folder) + "/" + encodeURIComponent(slug);

      page.replaceChildren(
        el("div", { class: "product" },
          artFrom(preview, w.name, w.category),
          el("div", {},
            el("h1", { class: "t-large" }, w.name),
            el("p", { class: "subtitle" }, w.description || categoryName(w.category)),
            el("div", { class: "byline" }, avatar(author, 32),
              el("div", {}, el("a", { class: "t-reduced", href: "profile.html?user=" + encodeURIComponent(author.username), style: "color: inherit" }, "By " + author.username),
                author.bio ? el("div", { class: "t-caption" }, author.bio) : null)),
            el("div", { class: "actions" },
              getButton(id, w.version, "Get", "button"),
              el("a", { class: "more", href: "#source" }, "View source")),
            el("p", { class: "t-caption" }, "Get opens Desk Widgets. It checks this exact code and asks before installing."))),
        el("div", { class: "info", role: "list" },
          fact("Version", String(w.version), "latest"),
          fact("Category", categoryName(w.category), ""),
          fact("Reviewed", formatDate(w.reviewed_at), "by a maintainer"),
          fact("Size", kb + " KB", "C# source"),
          fact("Needs", "API " + w.api_version, "Desk Widgets")),
        el("h2", { class: "block", id: "source" }, "Source"),
        el("p", { class: "t-reduced" }, "This is the code that runs on your PC. SHA-256 " + w.sha256),
        el("pre", { class: "code" }, visibleSource(source)),
        el("h2", { class: "block" }, "History"),
        el("p", { class: "t-reduced" }, "Every version of this widget was reviewed as a pull request. ",
          el("a", { class: "more", href: history, rel: "noreferrer" }, "See its history on GitHub")));
    }
    load();
  </script>
</body>
</html>
